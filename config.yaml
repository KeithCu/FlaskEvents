# Flask Events Configuration

# Database Settings
database:
  path: "events.db"
  echo: false

# Flask Settings
secret_key: "your-secret-key-change-this-in-production"

# Login users (only username "admin" can manage users in the UI)
users:
  - username: "admin"
    password_hash: ""

# Timezone Settings
timezone:
  local: "America/New_York"
